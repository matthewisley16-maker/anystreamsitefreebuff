name: MattStream builds

# Builds the three shippable artifacts on every MattStream change and keeps a
# download page on the repository:
#   MattStream-phone-release.apk   (Android phone / tablet)
#   MattStream-tv-release.apk      (Android TV, Fire TV, Google TV)
#   MattStream-Windows-x64.zip     (portable desktop app)

on:
  push:
    branches: [main]
    paths:
      - 'mattstream/**'
      - '.github/workflows/mattstream-builds.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mattstream-builds
  cancel-in-progress: true

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build APKs
        working-directory: mattstream/android
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Report Gradle failure
        if: failure()
        working-directory: mattstream/android
        run: |
          python3 -c 'import pathlib,re;t=pathlib.Path("build.log").read_text(errors="ignore");k=re.compile(r"error:|What went wrong|Caused by|FAILURE|Could not|FAILED|e: ");L=[l for l in t.splitlines() if k.search(l)][-40:];c="\n".join(L)[:3400].replace("%","%25").replace("\r","").replace("\n","%0A");print("::error title=Gradle failure::"+c)'

      - name: Collect APKs
        run: |
          mkdir -p out
          find mattstream/android/app/build -name '*.apk' -exec cp -v {} out/ \; || true
          count=$(ls -1 out/*.apk 2>/dev/null | wc -l)
          echo "::notice title=Collected APKs::$count files: $(ls -1 out 2>/dev/null | tr '\n' ' ')"
          if [ "$count" -lt 2 ]; then
            echo "::error title=Missing APKs::expected a phone and a tv APK, found $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mattstream-apks
          path: out/*.apk

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron
        working-directory: mattstream
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Bundle FFmpeg
        working-directory: mattstream
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ff.zip
          Expand-Archive -Path ff.zip -DestinationPath ff -Force
          $exe = Get-ChildItem -Path ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin/ffmpeg.exe
          Remove-Item ff.zip, ff -Recurse -Force

      - name: Package portable app
        working-directory: mattstream
        run: node scripts/package-windows.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: mattstream-windows
          path: mattstream/dist/MattStream-Windows-x64.zip

  publish:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mattstream-latest
          name: MattStream - latest builds
          body: |
            Installers built automatically from the latest MattStream code.

            - **MattStream-phone-release.apk** - Android phone or tablet
            - **MattStream-tv-release.apk** - Android TV, Fire TV, Google TV
            - **MattStream-Windows-x64.zip** - portable Windows app, unzip and run MattStream.exe

            On first launch the Android app asks for the address MattStream shows in its desktop app.
            Both devices must be on the same Wi-Fi.
          files: |
            downloads/**/*.apk
            downloads/**/*.zip
          fail_on_unmatched_files: false
